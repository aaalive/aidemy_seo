[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidemy-seo"
version = "0.1.0"
description = "YouTube SEO analytics and optimisation for educational channels: keyword demand, title and description scoring, best posting times, competitor title patterns, learning from your own channel data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AiDemy" }]
dependencies = []          # core is pure standard library

[project.optional-dependencies]
http = ["requests>=2.28"]  # live YouTube autocomplete / Data API calls
dev = ["pytest>=7"]

[project.scripts]
aidemy-seo = "aidemy_seo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
